<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#B7950B" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Golden Aura -->
  <circle cx="200" cy="200" r="190" fill="url(#goldGlow)" />

  <g stroke="url(#goldStroke)" fill="none" filter="url(#glowEffect)">
    <!-- Outer Degree Ring with 64 Divisions -->
    <circle cx="200" cy="200" r="185" stroke-width="1.5" />
    <circle cx="200" cy="200" r="177" stroke-width="0.75" />
    <circle cx="200" cy="200" r="172" stroke-width="0.5" stroke-dasharray="2,3" />

    <!-- 16 Directional Radiating Lines (32/16 padas) -->
    <g stroke-width="0.75" opacity="0.6">
      <line x1="200" y1="15" x2="200" y2="385" />
      <line x1="15" y1="200" x2="385" y2="200" />
      <line x1="69" y1="69" x2="331" y2="331" />
      <line x1="69" y1="331" x2="331" y2="69" />
      
      <!-- Sub-directions (22.5 deg) -->
      <line x1="200" y1="200" x2="371" y2="271" stroke-dasharray="3,3" />
      <line x1="200" y1="200" x2="29" y2="129" stroke-dasharray="3,3" />
      <line x1="200" y1="200" x2="371" y2="129" stroke-dasharray="3,3" />
      <line x1="200" y1="200" x2="29" y2="271" stroke-dasharray="3,3" />
      <line x1="200" y1="200" x2="271" y2="371" stroke-dasharray="3,3" />
      <line x1="200" y1="200" x2="129" y2="29" stroke-dasharray="3,3" />
      <line x1="200" y1="200" x2="129" y2="371" stroke-dasharray="3,3" />
      <line x1="200" y1="200" x2="271" y2="29" stroke-dasharray="3,3" />
    </g>

    <!-- Concentric Sacred Rings -->
    <circle cx="200" cy="200" r="145" stroke-width="1.2" />
    <circle cx="200" cy="200" r="132" stroke-width="0.75" stroke-dasharray="4,4" />
    <circle cx="200" cy="200" r="105" stroke-width="1.5" />
    <circle cx="200" cy="200" r="80" stroke-width="0.75" />
    <circle cx="200" cy="200" r="50" stroke-width="1.2" />
    <circle cx="200" cy="200" r="24" stroke-width="1.5" />

    <!-- Overlapping Sacred Hexagrams / Star Polygons -->
    <polygon points="200,68 314,266 86,266" stroke-width="1" opacity="0.8" />
    <polygon points="200,332 314,134 86,134" stroke-width="1" opacity="0.8" />

    <!-- 8-Pointed Star of Lakshmi / Astha Lakshmi -->
    <polygon points="200,55 235,165 345,200 235,235 200,345 165,235 55,200 165,165" stroke-width="0.85" opacity="0.7" />
    <polygon points="200,75 225,175 325,200 225,225 200,325 175,225 75,200 175,175" stroke-width="0.5" opacity="0.5" />

    <!-- Central Bindu Energy Center -->
    <circle cx="200" cy="200" r="6" fill="#D4AF37" />
    <circle cx="200" cy="200" r="12" stroke-width="0.75" />
  </g>
</svg>
