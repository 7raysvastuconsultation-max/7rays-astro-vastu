<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#cosmicGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <!-- 7 Rays Sun / Cosmic Star -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round">
    <line x1="50" y1="12" x2="50" y2="24" />
    <line x1="77.6" y1="23.3" x2="68.2" y2="32.8" />
    <line x1="88" y1="50" x2="76" y2="50" />
    <line x1="77.6" y1="76.7" x2="68.2" y2="67.2" />
    <line x1="50" y1="88" x2="50" y2="76" />
    <line x1="22.4" y1="76.7" x2="31.8" y2="67.2" />
    <line x1="12" y1="50" x2="24" y2="50" />
  </g>
  <!-- Central Vastu Lotus Mandala -->
  <circle cx="50" cy="50" r="14" fill="#F59E0B" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="1.8" />
  <circle cx="50" cy="50" r="5" fill="url(#goldGrad)" />
</svg>