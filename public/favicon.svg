<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Midnight Navy -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0b1329" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#040814" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="goldAura" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>
    <!-- Facet Light (Highlight Side) -->
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <!-- Facet Mid (Reflective Satin Side) -->
    <linearGradient id="facetMid" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <!-- Facet Shadow (Deep Chisel) -->
    <linearGradient id="facetShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <!-- Gold Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Circular Luxury Base -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGlow)" stroke="url(#goldRim)" stroke-width="1.5" />
  <circle cx="50" cy="50" r="42" fill="url(#goldAura)" />

  <!-- Tertiary Micro-Rays (Small Accents) -->
  <g id="microRays">
    <!-- North-North-East etc. -->
    <polygon points="50,50 54,42 50,32 46,42" fill="url(#facetLight)" opacity="0.6" />
    <polygon points="50,50 58,46 68,50 58,54" fill="url(#facetLight)" opacity="0.6" />
    <polygon points="50,50 54,58 50,68 46,58" fill="url(#facetShadow)" opacity="0.6" />
    <polygon points="50,50 42,46 32,50 42,54" fill="url(#facetMid)" opacity="0.6" />
  </g>

  <!-- Secondary Intermediate Rays (45 deg) -->
  <g id="diagonalRays">
    <!-- NE Ray -->
    <polygon points="50,50 50,44 76,24" fill="url(#facetLight)" />
    <polygon points="50,50 56,50 76,24" fill="url(#facetShadow)" />
    <!-- NW Ray -->
    <polygon points="50,50 44,50 24,24" fill="url(#facetLight)" />
    <polygon points="50,50 50,44 24,24" fill="url(#facetMid)" />
    <!-- SE Ray -->
    <polygon points="50,50 56,50 76,76" fill="url(#facetMid)" />
    <polygon points="50,50 50,56 76,76" fill="url(#facetShadow)" />
    <!-- SW Ray -->
    <polygon points="50,50 50,56 24,76" fill="url(#facetMid)" />
    <polygon points="50,50 44,50 24,76" fill="url(#facetShadow)" />
  </g>

  <!-- Primary Cardinal Rays (North, South, East, West - 3D Facets) -->
  <g id="cardinalRays">
    <!-- North Ray (Main Spike) -->
    <polygon points="50,50 43,45 50,6" fill="url(#facetLight)" />
    <polygon points="50,50 57,45 50,6" fill="url(#facetShadow)" />

    <!-- South Ray (Lower Spike) -->
    <polygon points="50,50 43,55 50,94" fill="url(#facetMid)" />
    <polygon points="50,50 57,55 50,94" fill="url(#facetShadow)" />

    <!-- West Ray (Left Spike) -->
    <polygon points="50,50 45,43 6,50" fill="url(#facetLight)" />
    <polygon points="50,50 45,57 6,50" fill="url(#facetShadow)" />

    <!-- East Ray (Right Spike) -->
    <polygon points="50,50 55,43 94,50" fill="url(#facetMid)" />
    <polygon points="50,50 55,57 94,50" fill="url(#facetShadow)" />
  </g>

  <!-- Central Pyramidal Diamond Facets -->
  <g id="centerHub">
    <!-- Center North-West facet -->
    <polygon points="50,50 43,45 50,42" fill="#FFFBEB" />
    <!-- Center North-East facet -->
    <polygon points="50,50 50,42 57,45" fill="#FDE68A" />
    <!-- Center East-South facet -->
    <polygon points="50,50 57,45 57,55" fill="#D97706" />
    <!-- Center South-West facet -->
    <polygon points="50,50 57,55 50,58" fill="#92400E" />
    <polygon points="50,50 50,58 43,55" fill="#78350F" />
    <polygon points="50,50 43,55 43,45" fill="#F59E0B" />
    <!-- Tiny center gleam point -->
    <circle cx="50" cy="50" r="1.5" fill="#FFFDF5" />
  </g>
</svg>